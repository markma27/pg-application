name: Dependency audit

# Daily vulnerability scan. Report-only:
#   - emails a detailed breakdown ONLY when vulnerabilities are found
#   - stays silent when the tree is clean
#   - never opens a PR and never changes a dependency
#
# Required repo secrets: MAIL_USERNAME, MAIL_PASSWORD

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci` — `npm audit` resolves the tree from package-lock.json alone.
      - name: Scan for vulnerabilities
        id: audit
        env:
          # Lowest severity worth an email. Raise to `moderate` or `high` if
          # low-severity transitive noise ever makes this chatty.
          AUDIT_LEVEL: low
        run: node scripts/audit-report.mjs

      - name: Email — vulnerabilities detected
        if: steps.audit.outputs.has_vulns == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[pg-application] ${{ steps.audit.outputs.summary }}"
          to: mayinxing@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ${{ steps.audit.outputs.report }}

            ---
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Repository: ${{ github.repository }}

  notify-failure:
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # Without this a broken scanner would fail silently and look like "no vulnerabilities".
      - name: Email — scan itself failed
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[pg-application] Daily vulnerability scan FAILED to run"
          to: mayinxing@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The daily vulnerability scan could not complete, so today's dependencies were NOT checked.

            This is a scanner failure, not a vulnerability report.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Repository: ${{ github.repository }}

            Run locally: npm audit
